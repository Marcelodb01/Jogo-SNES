name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Cache do SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v4-${{ runner.os }}-

      - name: Limpar SDK incompleto
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$SDK" ] && [ ! -x "$SDK/tools/bin/sdkmanager" ]; then
            echo "SDK sem sdkmanager: removendo para baixar do zero."
            rm -rf "$SDK"
          fi

      - name: Plantar OpenSSL no cache do p4a
        shell: bash
        run: |
          VER="3.3.1"
          TARBALL="openssl-$VER.tar.gz"
          SHA="777cd596284c883375a2a7a11bf5d2786fc5413255efab20c50d6ffe6d020b7e"
          TMP="$RUNNER_TEMP/$TARBALL"

          echo ">>> openssl.org devolve HTTP 500; usando o espelho oficial no GitHub."
          curl -fL --retry 3 --retry-delay 2 -o "$TMP" \
            "https://github.com/openssl/openssl/releases/download/openssl-$VER/$TARBALL"

          echo "$SHA  $TMP" | sha256sum -c -
          echo ">>> integridade confirmada."

          for D in build-arm64-v8a build-armeabi-v7a build-arm64-v8a_armeabi-v7a; do
            DEST="$GITHUB_WORKSPACE/.buildozer/android/platform/$D/packages/openssl"
            mkdir -p "$DEST"
            cp "$TMP" "$DEST/$TARBALL"
            touch "$DEST/.mark-$TARBALL"
          done

          ALT="$HOME/.buildozer/android/packages/openssl"
          mkdir -p "$ALT"
          cp "$TMP" "$ALT/$TARBALL"
          touch "$ALT/.mark-$TARBALL"

          echo ">>> tarball plantado nas pastas de pacotes."

      - name: Compilar o APK
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          escrever_licencas() {
            [ -d "$SDK" ] || return 0
            mkdir -p "$SDK/licenses"
            printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
            printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"
            printf '\n859f317696f67ef3d7f30a50a5560e7834b43903\n' > "$SDK/licenses/android-sdk-arm-dbt-license"
            echo ">>> licencas escritas."
          }

          corrigir_sdk() {
            escrever_licencas
            SM="$SDK/tools/bin/sdkmanager"
            [ -x "$SM" ] || { echo ">>> sdkmanager ainda nao existe."; return 0; }
            yes | "$SM" --sdk_root="$SDK" "platform-tools" "build-tools;33.0.2" > /dev/null 2>&1 || true
            BT="$SDK/build-tools"
            [ -d "$BT" ] || return 0
            NEWEST=$(ls "$BT" | sort -V | tail -1)
            if [ ! -f "$BT/$NEWEST/aidl" ]; then
              SRC=$(find "$BT" -name aidl -type f | head -1)
              [ -n "$SRC" ] && cp "$SRC" "$BT/$NEWEST/aidl" && chmod +x "$BT/$NEWEST/aidl"
            fi
          }

          for TENTATIVA in 1 2 3; do
            echo "=============================================="
            echo "TENTATIVA $TENTATIVA"
            echo "=============================================="

            set +e
            buildozer -v android debug 2>&1 | tee build.log
            STATUS=${PIPESTATUS[0]}
            set -e

            if [ $STATUS -eq 0 ]; then
              echo ">>> Build concluido com sucesso."
              exit 0
            fi

            if grep -qE "Aidl not found|Aidl cannot be executed|license is not accepted|sdkmanager is not ?installed|does not exist, sdkmanager" build.log; then
              echo ">>> Falha de SDK. Corrigindo e repetindo."
              corrigir_sdk
              continue
            fi

            if grep -qE "HTTPError|Download failed|URLError|Connection reset|timed out" build.log; then
              echo ">>> Falha de rede ao baixar fontes. Repetindo."
              sleep 15
              continue
            fi

            echo ">>> Falha de compilacao. Parando aqui."
            exit $STATUS
          done

          echo ">>> Esgotadas as 3 tentativas."
          exit 1

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-debug-apk
          path: bin/*.apk
          if-no-files-found: error
