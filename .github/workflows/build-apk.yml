name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Cache do SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v4-${{ runner.os }}-

      - name: Limpar SDK incompleto
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$SDK" ] && [ ! -x "$SDK/tools/bin/sdkmanager" ]; then
            echo "SDK sem sdkmanager: removendo."
            rm -rf "$SDK"
          fi

      - name: Compilar o APK
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          escrever_licencas() {
            [ -d "$SDK" ] || return 0
            mkdir -p "$SDK/licenses"
            printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
            printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"
            printf '\n859f317696f67ef3d7f30a50a5560e7834b43903\n' > "$SDK/licenses/android-sdk-arm-dbt-license"
          }

          corrigir_sdk() {
            escrever_licencas
            SM="$SDK/tools/bin/sdkmanager"
            [ -x "$SM" ] || return 0
            yes | "$SM" --sdk_root="$SDK" "platform-tools" "build-tools;33.0.2" > /dev/null 2>&1 || true
            BT="$SDK/build-tools"
            [ -d "$BT" ] || return 0
            NEWEST=$(ls "$BT" | sort -V | tail -1)
            if [ ! -f "$BT/$NEWEST/aidl" ]; then
              SRC=$(find "$BT" -name aidl -type f | head -1)
              [ -n "$SRC" ] && cp "$SRC" "$BT/$NEWEST/aidl" && chmod +x "$BT/$NEWEST/aidl"
            fi
          }

          STATUS=1
          for TENTATIVA in 1 2 3; do
            echo "=============== TENTATIVA $TENTATIVA ==============="
            set +e
            buildozer -v android debug > build.log 2>&1
            STATUS=$?
            set -e

            tail -5 build.log

            [ $STATUS -eq 0 ] && break

            if grep -qE "Aidl not found|license is not accepted|sdkmanager is not ?installed|does not exist, sdkmanager" build.log; then
              echo ">>> Falha de SDK. Corrigindo."
              corrigir_sdk
            elif grep -qE "HTTPError|Download failed|URLError|Connection reset|timed out" build.log; then
              echo ">>> Falha de rede. Repetindo em 15s."
              sleep 15
            else
              echo ">>> Falha de compilacao."
              break
            fi
          done

          if [ $STATUS -ne 0 ]; then
            echo ""
            echo "########################################################"
            echo "#   ULTIMAS 120 LINHAS DO LOG - O ERRO ESTA AQUI       #"
            echo "########################################################"
            tail -120 build.log
            echo "########################################################"
            exit $STATUS
          fi

      - name: Guardar log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-debug-apk
          path: bin/*.apk
          if-no-files-found: error
