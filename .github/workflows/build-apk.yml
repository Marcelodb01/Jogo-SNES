name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Cache do SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v4-${{ runner.os }}-

      - name: Limpar SDK incompleto
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$SDK" ] && [ ! -x "$SDK/tools/bin/sdkmanager" ]; then
            echo "SDK existe mas nao tem sdkmanager: removendo para o Buildozer baixar do zero."
            rm -rf "$SDK"
          fi

      - name: Compilar o APK
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          escrever_licencas() {
            [ -d "$SDK" ] || return 0
            mkdir -p "$SDK/licenses"
            printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
            printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"
            printf '\n859f317696f67ef3d7f30a50a5560e7834b43903\n' > "$SDK/licenses/android-sdk-arm-dbt-license"
            echo ">>> licencas escritas em $SDK/licenses"
          }

          corrigir_sdk() {
            escrever_licencas
            SM="$SDK/tools/bin/sdkmanager"
            if [ ! -x "$SM" ]; then
              echo ">>> sdkmanager ainda nao existe; nada a corrigir nesta rodada."
              return 0
            fi
            yes | "$SM" --sdk_root="$SDK" "platform-tools" "build-tools;33.0.2" > /dev/null 2>&1 || true
            BT="$SDK/build-tools"
            [ -d "$BT" ] || return 0
            NEWEST=$(ls "$BT" | sort -V | tail -1)
            echo ">>> build-tools mais recente: $NEWEST"
            if [ ! -f "$BT/$NEWEST/aidl" ]; then
              SRC=$(find "$BT" -name aidl -type f | head -1)
              if [ -n "$SRC" ]; then
                echo ">>> copiando aidl de $SRC"
                cp "$SRC" "$BT/$NEWEST/aidl"
                chmod +x "$BT/$NEWEST/aidl"
              fi
            fi
          }

          for TENTATIVA in 1 2 3; do
            echo "=============================================="
            echo "TENTATIVA $TENTATIVA"
            echo "=============================================="

            set +e
            buildozer -v android debug 2>&1 | tee build.log
            STATUS=${PIPESTATUS[0]}
            set -e

            if [ $STATUS -eq 0 ]; then
              echo ">>> Build concluido com sucesso."
              exit 0
            fi

            if grep -qE "Aidl not found|Aidl cannot be executed|license is not accepted|sdkmanager is not ?installed|does not exist, sdkmanager" build.log; then
              echo ">>> Falha de SDK detectada. Aplicando correcao e tentando de novo."
              corrigir_sdk
            else
              echo ">>> Falha NAO relacionada ao SDK. Parando aqui."
              exit $STATUS
            fi
          done

          echo ">>> Esgotadas as 3 tentativas."
          exit 1

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-debug-apk
          path: bin/*.apk
          if-no-files-found: error
